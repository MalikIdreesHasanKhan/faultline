[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "datahub-faultline"
version = "0.1.0"
description = "A DataHub-native agent that predicts ML incident blast radius and writes durable context back to the graph."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FAULTLINE contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.9,<2",
  "tomli>=2.0,<3; python_version < '3.11'",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
faultline = "faultline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
